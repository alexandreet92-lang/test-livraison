# Réglages Netlify — ce fichier est lu à chaque mise en ligne.
#
# CE SITE N'A PAS D'ÉTAPE DE CONSTRUCTION : le dossier est publié tel quel.
# Le client n'a donc aucun réglage à taper dans Netlify.

[build]
  publish = "."

# ── APERÇU PROVISOIRE : NE PAS INDEXER ─────────────────────────────────────
# Tant que ce bloc est là, Google ignore le site. Il est ICI, à un seul
# endroit, exprès.
#
# >>> POUR LA VRAIE MISE EN LIGNE : SUPPRIMER TOUT CE BLOC (jusqu'à la ligne
# >>> « FIN DU BLOC APERÇU »), puis publier à nouveau.
# >>> Oublier de le faire, c'est un site que personne ne trouvera jamais.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
# ── FIN DU BLOC APERÇU ─────────────────────────────────────────────────────

# Sécurité de base, utile en production comme en aperçu.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Les images et le CSS changent rarement : le navigateur peut les garder.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
